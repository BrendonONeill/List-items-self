<!DOCTYPE html>

<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title></title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <nav>
            <h1>Freezer Planner</h1>
        </nav>
       <main>
        <div class="fridge-container">
            <div class="drawer">
                <div class="delete-drawer"><img src="delete.svg" width="50" height="50" alt=""></div>
                <div class="drawer-handle">
                    <img src="arrow.svg"  width="25" alt="">
                </div>
            </div>
            <div class="freezer">
                <div class="one-container box-container">
                    <div class="badge-number"><p>1</p></div>
                </div>
                <div class="two-container box-container">
                    <div class="badge-number"><p>2</p></div>
                </div>
                <div class="three-container box-container">
                    <div class="badge-number"><p>3</p></div>
                </div>
                <div class="four-container box-container">
                    <div class="badge-number"><p>4</p></div>
                </div>
                <div class="five-container box-container">
                    <div class="badge-number"><p>5</p></div>
                </div>
                <div class="six-container box-container">
                    <div class="badge-number"><p>6</p></div>
                </div>
            </div>
        </div>
        <div class="form-container">
            <form>
                <label for="item-name">
                    Item Name
                    <input type="text" name="item-name" id="" class="form-name">
                </label>
                <div class="radios">
                    <label for="">
                    Meat
                    <input type="radio" name="type" id="" value="meat" checked class="form-type">
                    </label>
                <label for="">
                    Veg
                    <input type="radio" name="type" id="" value="veg" class="form-type">
                </label>
                <label for="">
                    Carb
                    <input type="radio" name="type" id="" value="carb" class="form-type">
                </label>
                <label for="">
                    Desert
                    <input type="radio" name="type" value="desert" class="form-type">
                </label>
                </div>
                <label for="container-num">
                    Container Number
                    <input type="number" name="container-num" min=1 max=6 value=1 class="form-number">
                </label>
                <input type="submit" class="submit" value="Create">
            </form>
            <div class="delete"><img src="delete.svg" width="50" height="50" alt=""></div>
        </div>
       </main>
       <footer>

       </footer>   
        <script src="main.js" async defer></script>
    </body>
</html>
